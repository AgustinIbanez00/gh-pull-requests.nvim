name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NVIM_VERSION: v0.12.3

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl lua5.1 luarocks
          curl -fsSLo /tmp/nvim-linux-x86_64.tar.gz "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          sudo tar -C /opt -xzf /tmp/nvim-linux-x86_64.tar.gz
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          sudo luarocks install luacheck

      - name: Show tool versions
        shell: bash
        run: |
          pwsh -NoLogo -Command '$PSVersionTable.PSVersion.ToString()'
          nvim --version | head -n 1
          luacheck --version

      - name: Run validation
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Run luacheck (advisory)
        continue-on-error: true
        shell: bash
        run: luacheck lua plugin
